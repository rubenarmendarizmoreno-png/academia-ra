<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RA Trading Academy</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --gold-hover: #d97706;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #334155;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #020617;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--gold);
    }

    main {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1rem;
      width: 100%;
      box-sizing: border-box;
    }

    h2 {
      border-bottom: 2px solid var(--gold);
      padding-bottom: 0.5rem;
      margin-top: 2rem;
      color: var(--gold);
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .module-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .module-card.locked {
      opacity: 0.6;
    }

    .module-badge {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: bold;
    }

    .badge-completed {
      font-size: 0.75rem;
      color: #10b981;
      float: right;
    }

    .module-card h3 {
      margin: 0.5rem 0;
      font-size: 1.1rem;
    }

    .module-card p {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.4;
      flex: 1;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn {
      padding: 0.6rem 0.8rem;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-gold {
      background-color: var(--gold);
      color: #000;
    }

    .btn-gold:hover:not(:disabled) {
      background-color: var(--gold-hover);
    }

    /* Modales */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      padding: 1rem;
      box-sizing: border-box;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: 8px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">RA TRADING ACADEMY</div>
  </header>

  <main>
    <h2>NIVEL PRINCIPIANTE – FUNDAMENTOS Y MECÁNICA DE FUTUROS</h2>
    <div id="rejilla-principiante" class="modules-grid"></div>

    <h2>NIVEL INTERMEDIO – ESTRUCTURA Y ACCIÓN DEL PRECIO</h2>
    <div id="rejilla-intermedio" class="modules-grid"></div>

    <h2>NIVEL AVANZADO – GESTIÓN DE RIESGO Y MAESTRÍA</h2>
    <div id="rejilla-avanzado" class="modules-grid"></div>
  </main>

  <!-- Modal Contenido del Módulo -->
  <div id="modalModulo" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Módulo</h3>
        <button class="close-btn" onclick="cerrarModal('modalModulo')">&times;</button>
      </div>
      <div id="cuerpomodal"></div>
    </div>
  </div>

  <!-- Modal Examen -->
  <div id="quizModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="quizTitle">Examen</h3>
        <button class="close-btn" onclick="cerrarModal('quizModal')">&times;</button>
      </div>
      <div id="quizContent"></div>
    </div>
  </div>

  <script>
    const MODULOS = [
      { id: 1, nivel: 'principiante', título: "1. Fundamentos del Trading de Futuros", descripción: "Introducción a los contratos de futuros e instrumentos apalancados." },
      { id: 2, nivel: 'principiante', título: "2. Mecánica de Mercado", descripción: "Especificaciones, tick value, margin requirement y sesión inicial." },
      { id: 3, nivel: 'principiante', título: "3. Tipos de Órdenes", descripción: "Market, Limit, Stop y combinaciones de gestión de posición." },
      { id: 4, nivel: 'principiante', título: "4. Configuración de NinjaTrader 8", descripción: "Manejo de gráficos, plantillas y conexión de datos." },
      { id: 5, nivel: 'intermedio', título: "5. Acción del Precio Básica", descripción: "Lectura de velas, soportes, resistencias y tendencias." },
      { id: 6, nivel: 'avanzado', título: "6. Gestión de Riesgo Profesional", descripción: "Cálculo de drawdown, tamaño de posición y plan de operaciones." }
    ];

    function renderModules() {
      const progreso = JSON.parse(localStorage.getItem('ra_progress') || '{}');

      ['principiante', 'intermedio', 'avanzado'].forEach(nivel => {
        const contenedor = document.getElementById(`rejilla-${nivel}`);
        if (!contenedor) return;
        contenedor.innerHTML = '';

        const modulosNivel = MODULOS.filter(m => m.nivel === nivel);

        modulosNivel.forEach(mod => {
          const estaCompletado = progreso[mod.id]?.completed || false;
          const estaBloqueado = mod.id > 1 && !progreso[mod.id - 1]?.completed;

          const tarjeta = document.createElement('div');
          tarjeta.className = `module-card ${estaBloqueado ? 'locked' : ''}`;

          tarjeta.innerHTML = `
            <div>
              <div class="card-header">
                <span class="module-badge">MÓDULO ${mod.id}</span>
                ${estaCompletado ? '<span class="badge-completed">✓ COMPLETADO</span>' : ''}
              </div>
              <h3>${mod.título}</h3>
              <p>${mod.descripción}</p>
            </div>
         tarjeta.innerHTML = `
            <div>
              <div class="card-header">
                <span class="module-badge">MÓDULO ${mod.id}</span>
                ${estaCompletado ? '<span class="badge-completed">✓ COMPLETADO</span>' : ''}
              </div>
              <h3>${mod.título}</h3>
              <p>${mod.descripción}</p>
            </div>
            
    <div class="card-actions" style="display: flex; gap: 8px; margin-top: 12px;">
              <button class="btn btn-primary" style="font-size: 0.8rem; flex: 1;" ${estaBloqueado ? 'disabled' : ''} onclick="openModuleContent(${mod.id})">📚 Ver Módulo</button>
              <button class="btn btn-gold" style="font-size: 0.8rem; flex: 1;" ${estaBloqueado ? 'disabled' : ''} onclick="openModuleQuiz(${mod.id})">${estaCompletado ? 'Repasar Examen' : 'Rendir Examen'}</button>
            </div>
          `;

    function openModuleContent(id) {
      const mod = MODULOS.find(m => m.id === id);
      document.getElementById('modalTitle').innerText = mod.título;
      document.getElementById('cuerpomodal').innerHTML = `
        <p>${mod.descripción}</p>
        <hr style="border-color: var(--border); margin: 1.5rem 0;" />
        <h4>Contenido del Módulo</h4>
        <p>Aquí se presenta la lección interactiva del módulo ${id}. Lee el material detalladamente antes de presentar tu evaluación.</p>
        <button class="btn btn-gold" style="margin-top: 1rem; width: 100%;" onclick="cerrarModal('modalModulo')">Entendido, ir al examen</button>
      `;
      document.getElementById('modalModulo').style.display = 'flex';
    }

    function openModuleQuiz(id) {
      const mod = MODULOS.find(m => m.id === id);
      document.getElementById('quizTitle').innerText = `Examen: ${mod.título}`;
      document.getElementById('quizContent').innerHTML = `
        <p>Responde a las preguntas de evaluación para desbloquear el siguiente nivel.</p>
        <button class="btn btn-primary" style="margin-top: 1rem; width: 100%;" onclick="completarExamen(${id})">Simular Aprobación de Examen</button>
      `;
      document.getElementById('quizModal').style.display = 'flex';
    }

    function completarExamen(id) {
      const progreso = JSON.parse(localStorage.getItem('ra_progress') || '{}');
      progreso[id] = { completed: true };
      localStorage.setItem('ra_progress', JSON.stringify(progreso));
      cerrarModal('quizModal');
      renderModules();
    }

    function cerrarModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Inicializar
    renderModules();
  </script>
</body>
</html>
